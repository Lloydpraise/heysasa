<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Login | HeySasa!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FAFAFA;
            color: #1F2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND (Matches Landing Page) --- */
        .bg-grain-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -2;
        }
        .bg-grain {
            width: 100%; height: 100%; opacity: 0.3;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; background: #FAFAFA;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.25;
            animation: float 12s infinite ease-in-out alternate;
        }
        .blob-1 { background: #28A745; width: 50vw; height: 50vw; top: -10vw; left: -10vw; }
        .blob-2 { background: #FF8C00; width: 40vw; height: 40vw; bottom: -10vw; right: -10vw; animation-delay: -3s; }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 40px); } }

        /* --- GLASS CARD --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05);
            border-radius: 2rem;
        }

        .btn-green-serious {
            background-color: #28A745; 
            color: white;
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.3);
            transition: all 0.3s ease;
        }
        .btn-green-serious:hover {
            background-color: #208739;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(40, 167, 69, 0.5);
        }

        .fade-hide { opacity: 0; pointer-events: none; position: absolute; transform: scale(0.95); transition: 0.4s ease; }
        .fade-show { opacity: 1; pointer-events: auto; position: relative; transform: scale(1); transition: 0.4s ease; }

        .otp-box {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .otp-box:focus {
            border-color: #28A745;
            background: white;
            outline: none;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-4 right-4 text-white px-6 py-4 rounded-2xl shadow-2xl transform translate-y-[-150%] transition-transform duration-300 z-50 font-medium">
        <span id="toast-message"></span>
    </div>

    <div class="w-full max-w-md px-6 z-10">
        
        <!-- ========================================== -->
        <!-- SCREEN 1: LOGIN                            -->
        <!-- ========================================== -->
        <div id="screen-login" class="glass-card p-10 text-center fade-show">
            <img src="images/heysasalogo1.png" alt="HeySasa!" class="h-10 mx-auto mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
            <p class="text-gray-500 mb-8 text-sm">Sign in to manage your AI sales assistant</p>

            <form id="login-form" class="space-y-5 text-left">
                <div>
                    <label class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Email</label>
                    <input type="email" id="email" required placeholder="name@company.com" class="w-full mt-2 bg-white/50 border border-gray-200 rounded-2xl px-5 py-3.5 focus:ring-2 focus:ring-[#28A745] focus:outline-none transition-all">
                </div>
                <div>
                    <label class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full mt-2 bg-white/50 border border-gray-200 rounded-2xl px-5 py-3.5 focus:ring-2 focus:ring-[#28A745] focus:outline-none transition-all">
                </div>
                <button type="submit" id="btn-login" class="w-full btn-green-serious py-4 rounded-full font-bold text-lg mt-4">
                    Sign In
                </button>
            </form>

            <div class="mt-8 border-t border-gray-100 pt-6">
                <button id="btn-switch-to-otp" class="text-sm font-semibold text-[#FF8C00] hover:underline">
                    Forgot password? Use a code instead
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- SCREEN 2: VERIFICATION                     -->
        <!-- ========================================== -->
        <div id="screen-otp" class="glass-card p-10 text-center fade-hide">
            <div class="w-12 h-12 bg-[#28A745]/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-6 h-6 text-[#28A745]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Check your inbox</h2>
            <p class="text-gray-500 text-sm mb-8">We've sent a 6-digit code to <br><span id="display-email" class="font-bold text-gray-800"></span></p>

            <form id="otp-form" class="space-y-8">
                <div class="flex justify-between gap-2" id="otp-inputs">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 rounded-xl text-center text-xl font-bold text-gray-800 shadow-sm">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 rounded-xl text-center text-xl font-bold text-gray-800 shadow-sm">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 rounded-xl text-center text-xl font-bold text-gray-800 shadow-sm">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 rounded-xl text-center text-xl font-bold text-gray-800 shadow-sm">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 rounded-xl text-center text-xl font-bold text-gray-800 shadow-sm">
                    <input type="text" maxlength="1" class="otp-box w-12 h-14 rounded-xl text-center text-xl font-bold text-gray-800 shadow-sm">
                </div>

                <button type="submit" id="btn-verify" class="w-full btn-green-serious py-4 rounded-full font-bold text-lg">
                    Verify & Sign In
                </button>
            </form>

            <p class="mt-8 text-sm">
                <button id="btn-back" class="text-gray-400 hover:text-gray-600 font-medium mr-4">Back to Login</button>
                <button id="btn-resend" class="text-[#FF8C00] font-semibold hover:underline">Resend Code</button>
            </p>
        </div>

    </div>

    <!-- Background Layers -->
    <div class="bg-grain-container"><div class="bg-grain"></div></div>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <script src="initSupabase.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script>
        // --- 1. CONFIGURATION ---
        // Supabase initialization in initSupabase.js
        // All API calls go through supabaseAPI from supabaseClient.js

        const screenLogin = document.getElementById('screen-login');
        const screenOtp = document.getElementById('screen-otp');
        const otpBoxes = document.querySelectorAll('.otp-box');
        let tempEmail = '';

        // --- 2. AUTH LOGIC ---
        
        // Email/Password Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await supabaseAPI.auth.signInWithPassword(email, password);
            if (!result.success) {
                notify(result.error.message);
            } else {
                window.location.href = '/dashboard'; 
            }
        });

        // Request OTP
        document.getElementById('btn-switch-to-otp').addEventListener('click', async () => {
            tempEmail = document.getElementById('email').value;
            if (!tempEmail) return notify("Please enter your email first");

            const result = await supabaseAPI.auth.signInWithOtp(tempEmail);
            if (!result.success) {
                notify(result.error.message);
            } else {
                document.getElementById('display-email').textContent = tempEmail;
                toggleScreens(true);
            }
        });

        // Verify OTP
        document.getElementById('otp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            let token = '';
            otpBoxes.forEach(b => token += b.value);

            const result = await supabaseAPI.auth.verifyOtp(tempEmail, token, 'email');
            if (!result.success) {
                notify(result.error.message);
                otpBoxes.forEach(b => b.value = '');
                otpBoxes[0].focus();
            } else {
                window.location.href = '/dashboard';
            }
        });

        // --- 3. UI HELPERS ---
        function notify(msg, err = true) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.style.backgroundColor = err ? '#ef4444' : '#28A745';
            t.classList.remove('translate-y-[-150%]');
            setTimeout(() => t.classList.add('translate-y-[-150%]'), 3000);
        }

        function toggleScreens(toOtp) {
            if (toOtp) {
                screenLogin.classList.replace('fade-show', 'fade-hide');
                setTimeout(() => screenOtp.classList.replace('fade-hide', 'fade-show'), 300);
            } else {
                screenOtp.classList.replace('fade-show', 'fade-hide');
                setTimeout(() => screenLogin.classList.replace('fade-hide', 'fade-show'), 300);
            }
        }

        document.getElementById('btn-back').onclick = () => toggleScreens(false);

        // Auto-focus OTP boxes
        otpBoxes.forEach((box, i) => {
            box.onkeyup = (e) => {
                if (e.key >= 0 && e.key <= 9 && i < 5) otpBoxes[i+1].focus();
                if (e.key === 'Backspace' && i > 0) otpBoxes[i-1].focus();
            };
        });
    </script>
</body>
</html>
